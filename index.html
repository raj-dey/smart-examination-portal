<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>University Quiz Pro | Secure Assessment</title>

  <script>
    // --- PROJECT CORE CONFIGURATION ---
    // This block allows the React app to access Firebase without hardcoding keys
    window.__firebase_config = JSON.stringify({
      apiKey: "%VITE_FIREBASE_API_KEY%",
      authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%",
      projectId: "%VITE_FIREBASE_PROJECT_ID%",
      storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
      messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
      appId: "%VITE_FIREBASE_APP_ID%",
      measurementId: "%VITE_FIREBASE_MEASUREMENT_ID%"
    });

    // Unified identifier for Firestore document paths
    window.__app_id = "%VITE_APP_ID%";
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
